name: Test and publish

# Runs the tests, then copies the app to the gh-pages branch, which GitHub
# Pages serves at https://99techgeek.github.io/Remembering/
on:
  push:
    branches: [main, claude/voice-notes-task-tracker-cl2302]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push the app to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -f .nojekyll
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push --force origin HEAD:gh-pages
